name: Build ImmortalWrt

on:
  push:
    tags:
      - "v**"
  workflow_dispatch:
    inputs:
      build_config:
        description: Firmware config to build
        required: true
        type: choice
        default: full
        options:
          - minimal
          - full
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"config_name":"full","config_file":"full"}]' || inputs.build_config == 'both' && '[{"config_name":"minimal","config_file":"minimal"},{"config_name":"full","config_file":"full"}]' || inputs.build_config == 'minimal' && '[{"config_name":"minimal","config_file":"minimal"}]' || '[{"config_name":"full","config_file":"full"}]') }}

    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "3000M"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Restore downloads
        uses: actions/cache@v6.1.0
        with:
          path: dl
          key: ${{ runner.os }}-immortalwrt-25.12-dl-${{ matrix.config_name }}-${{ hashFiles(format('defconfig/{0}.config', matrix.config_file)) }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-25.12-dl-${{ matrix.config_name }}-
            ${{ runner.os }}-immortalwrt-25.12-dl-

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-25.12-ccache-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles(format('defconfig/{0}.config', matrix.config_file)) }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-25.12-ccache-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles(format('defconfig/{0}.config', matrix.config_file)) }}-
            ${{ runner.os }}-immortalwrt-25.12-ccache-${{ matrix.config_name }}-
            ${{ runner.os }}-immortalwrt-25.12-ccache-

      - name: Restore host/toolchain cache
        id: host-toolchain-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ runner.os }}-immortalwrt-25.12-host-toolchain-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-25.12-host-toolchain-${{ matrix.config_name }}-${{ github.ref_name }}-${{ hashFiles('tools/**', 'toolchain/**', 'include/**') }}-
            ${{ runner.os }}-immortalwrt-25.12-host-toolchain-${{ matrix.config_name }}-
            ${{ runner.os }}-immortalwrt-25.12-host-toolchain-

      - name: Initialize build environment
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Prepare ccache
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          mkdir -p "$CCACHE_DIR" dl
          ccache -M "$CCACHE_MAXSIZE"
          ccache --zero-stats || true
          ccache --show-config | sed -n '1,20p'

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cp "defconfig/${{ matrix.config_file }}.config" .config
          grep -q '^CONFIG_CCACHE=y$' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          grep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_kmod-mediatek_hnat=|CONFIG_PACKAGE_luci-app-turboacc-mtk=|CONFIG_PACKAGE_zram-swap=)' .config || true

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Compile firmware
        run: |
          set -euo pipefail
          ccache --show-stats || true
          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed, retrying with -j1 V=s"
            make -j1 V=s
          fi
          ccache --show-stats || true

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save host/toolchain cache
        if: success() && steps.host-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
          key: ${{ steps.host-toolchain-cache.outputs.cache-primary-key }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware-${{ matrix.config_name }}
          path: bin/targets/mediatek/filogic/*.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: all-firmwares

      - name: Prepare release files
        run: |
          mkdir -p final-release
          find all-firmwares -type f -name '*.bin' -exec cp {} final-release/ \;

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.1
        with:
          draft: true
          make_latest: true
          tag_name: ${{ github.ref_name }}
          files: final-release/*.bin
